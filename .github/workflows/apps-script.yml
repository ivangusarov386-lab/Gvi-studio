name: Verify Apps Script bundle
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:google
      - name: Ensure Apps Script HTML is current
        run: git diff --exit-code -- apps-script/Index.html
      - run: npm test
